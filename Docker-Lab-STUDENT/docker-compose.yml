
# SecureNotes - Docker Compose Configuration

services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://securenotes:securepass123@db:5432/securenotes

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: securenotes
      POSTGRES_PASSWORD: securepass123
      POSTGRES_DB: securenotes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securenotes -d securenotes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
